name: CART3R diagnostics bridge

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cart3r-diagnostics-bridge
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch public read-only diagnostics
        uses: actions/github-script@v7
        env:
          CART3R_BASE_URL: https://cart3r-solana.onrender.com
          TARGET_BRANCH: cart3r-diagnostics
        with:
          script: |
            const base = process.env.CART3R_BASE_URL;
            const timeout = AbortSignal.timeout(20000);
            async function getJson(path) {
              const response = await fetch(base + path, {
                headers: { accept: "application/json" },
                signal: timeout
              });
              if (!response.ok) throw new Error(path + " returned HTTP " + response.status);
              return response.json();
            }

            const [status, payload] = await Promise.all([
              getJson("/status"),
              getJson("/pools")
            ]);

            if (!Array.isArray(payload.pools)) {
              throw new Error("/pools response did not contain a pools array");
            }

            const pick = (obj, keys) => Object.fromEntries(
              keys.filter(key => obj && Object.prototype.hasOwnProperty.call(obj, key))
                .map(key => [key, obj[key]])
            );

            const pools = payload.pools.map(p => ({
              ...pick(p, [
                "mint", "poolAddress", "name", "symbol", "dex",
                "liquidityVerified", "liquiditySol", "estimatedLiquiditySol",
                "quoteReserveSol", "quoteLiquidity", "quoteMint",
                "volumeSol", "volumeUsd", "activityCount", "buyCount",
                "sellCount", "buyersCount", "buyPressure",
                "buyPressureByVolume", "buyVolumeSol", "sellVolumeSol",
                "score", "eligible", "roundTripLossPct", "checkedAt"
              ]),
              securityChecked: Boolean(p.security && p.security.checked),
              securityRisks: Array.isArray(p.security?.risks) ? p.security.risks.slice(0, 8) : [],
              risks: Array.isArray(p.risks) ? p.risks.slice(0, 12) : [],
              quotes: p.quotes ? {
                buyOk: Boolean(p.quotes.buyOk),
                sellOk: Boolean(p.quotes.sellOk),
                roundTripLossPct: p.quotes.roundTripLossPct ?? null,
                error: p.quotes.error ? String(p.quotes.error).slice(0, 180) : null,
                quoteLadder: Array.isArray(p.quotes.quoteLadder)
                  ? p.quotes.quoteLadder.slice(0, 2).map(q => pick(q, [
                      "inputSol", "solBack", "roundTripLossPct",
                      "buyPriceImpactPct", "sellPriceImpactPct"
                    ]))
                  : []
              } : null
            }));

            const output = {
              retrievedAt: new Date().toISOString(),
              source: { status: "/status", pools: "/pools" },
              status: {
                ...pick(status, [
                  "running", "mode", "realTrading", "scanner", "poolsFound",
                  "catalogPools", "eligiblePools", "lastUpdate", "lastError",
                  "scanning", "nextScanInSeconds", "startedAt"
                ]),
                discovery: pick(status.discovery, [
                  "provider", "feeds", "callsCount", "successCount",
                  "failureCount", "lastCheck", "lastError", "cachedFeeds"
                ]),
                helius: pick(status.helius, [
                  "configured", "connected", "subscriptions", "lastCheck",
                  "lastSlot", "lastError", "transactionsSeen", "swapsDecoded",
                  "reconnects", "rpc429Retries", "droppedQueuedTransactions"
                ]),
                jupiter: pick(status.jupiter, [
                  "configured", "api", "lastCheck", "lastSolPriceUsd",
                  "checksCount", "successCount", "cooldownSeconds", "lastError"
                ]),
                protections: pick(status.protections, [
                  "mintAuthorityCheck", "freezeAuthorityCheck", "tokenProgramCheck",
                  "token2022ExtensionInspection", "poolAddressDiscovery",
                  "liquidityCheck", "observedSwapActivityCheck", "buyPressureCheck",
                  "volumePressureCheck", "scoreCheck", "buyQuoteCheck",
                  "sellQuoteCheck", "quoteLadderCheck", "sellabilitySimulation",
                  "realTrading"
                ])
              },
              count: pools.length,
              eligibleCount: pools.filter(p => p.eligible).length,
              liquidityVerifiedCount: pools.filter(p => p.liquidityVerified).length,
              pools
            };

            const body = JSON.stringify(output, null, 2) + "\n";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "bot/diagnostics/latest.json";
            const branch = process.env.TARGET_BRANCH;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner, repo, path, ref: branch
              });
              if (!Array.isArray(existing.data) && existing.data.content) {
                const oldBody = Buffer.from(existing.data.content, "base64").toString("utf8");
                if (oldBody === body) {
                  core.info("Diagnostics unchanged; no commit created.");
                  return;
                }
              }
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: "chore(diagnostics): refresh CART3R snapshot",
              content: Buffer.from(body, "utf8").toString("base64"),
              ...(sha ? { sha } : {})
            });

            core.info("Published sanitized snapshot: " + pools.length +
              " pools, " + output.eligibleCount + " eligible.");
